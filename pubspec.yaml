name: changa_app
description: "App para conectar clientes y trabajadores por ubicación"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Mapa
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  
  # Ubicación
  geolocator: ^12.0.0
  
  # Firebase - Base de datos + Notis
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  
  # Notificaciones locales con botón
  flutter_local_notifications: ^17.2.3
  
  # Para abrir Google Maps
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
