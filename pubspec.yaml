name: changa_app
description: "App para conectar clientes y trabajadores por ubicación"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Mapa
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  
  # Ubicación tipo Uber
  geolocator: ^12.0.0
  
  # Notificaciones
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  
  # Para descargar imagen del mapa para la noti
  http: ^1.2.2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
