name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Create fresh Android files
        run: |
          # Rescata temporalmente tu código y dependencias actuales
          mkdir -p tmp_backup
          cp -r lib tmp_backup/
          if [ -d "assets" ]; then cp -r assets tmp_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml tmp_backup/; fi

          # Borra la configuración vieja de android que da errores
          rm -rf android

          # Crea una estructura nueva y limpia con el nombre correcto de tu app
          flutter create . --org com.israbarreto110.sys --project-name changa_app --platforms=android

          # Restaura tu código fuente original
          rm -rf lib
          cp -r tmp_backup/lib .
          if [ -d "tmp_backup/assets" ]; then cp -r tmp_backup/assets .; fi
          if [ -f "tmp_backup/pubspec.yaml" ]; then cp tmp_backup/pubspec.yaml .; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: changa-app
          path: build/app/outputs/flutter-apk/app-release.apk
