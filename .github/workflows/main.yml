
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      # 1. Regenera la carpeta android con la v2 embedding moderna sin borrar tu código
      - name: Recreate modern Android project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.israbarreto110.sys --project-name changa_app

      # 2. Inyecta el google-services.json para Firebase
      - name: Add Google Services JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          mkdir -p android/app
          echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      # 3. Instala dependencias
      - name: Install dependencies
        run: flutter pub get

      # 4. Compila el APK Release
      - name: Build APK Release
        run: flutter build apk --release

      # 5. Sube el APK generado
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: changa-app
          path: build/app/outputs/flutter-apk/app-release.apk
