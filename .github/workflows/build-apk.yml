name: v60 - lista para apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
      
      - name: Add Google Services JSON
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | base64 -d > android/app/google-services.json || echo "no json"
      
      - name: Fix Android V1 embedding (AUTOFIX)
        run: |
          flutter clean
          rm -rf android
          flutter create . --platforms=android --org com.changaapp --project-name changa_app
          flutter pub add supabase_flutter firebase_core
          flutter pub get

      - name: Install dependencies
        run: flutter pub get
      
      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Changa-App-V60-APK
          path: build/app/outputs/flutter-apk/app-release.apk
